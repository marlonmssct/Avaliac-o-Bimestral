<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 110" width="340" height="110">
  <defs>
    <clipPath id="circle-clip-horizontal">
      <circle cx="55" cy="55" r="38"/>
    </clipPath>
  </defs>
  
  <!-- Outer Gold Ring -->
  <circle cx="55" cy="55" r="42" fill="none" stroke="#c49a6c" stroke-width="4"/>
  
  <!-- Circle Split: Top Half Dark Navy (#0e1927), Bottom Half White (#ffffff) -->
  <g clip-path="url(#circle-clip-horizontal)">
    <rect x="10" y="10" width="90" height="45" fill="#0e1927"/>
    <rect x="10" y="55" width="90" height="45" fill="#ffffff"/>
  </g>
  
  <!-- Inner ring & divider line -->
  <circle cx="55" cy="55" r="38" fill="none" stroke="#c49a6c" stroke-width="1.5"/>
  <line x1="17" y1="55" x2="93" y2="55" stroke="#c49a6c" stroke-width="1.5"/>

  <!-- Text ZÊNITE -->
  <text x="120" y="58" fill="#ffffff" font-family="'Georgia', 'Times New Roman', serif" font-size="36" font-weight="bold" letter-spacing="3">ZÊNITE</text>

  <!-- Text ACADEMIA -->
  <text x="122" y="86" fill="#c49a6c" font-family="'Archivo', 'Montserrat', 'Helvetica', sans-serif" font-size="17" font-weight="700" letter-spacing="6">ACADEMIA</text>
</svg>
